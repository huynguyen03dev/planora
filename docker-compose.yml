services:
  postgres:
    image: postgres:16-alpine
    container_name: planora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - planora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink for dev/test. Email verification stays enforced everywhere
  # (decision 0023) — Mailpit only changes WHERE the mail lands: instead of a
  # real inbox via Resend, dev/test mail is captured here and the verification
  # link is retrievable from the web UI (:8025) or its API for E2E. Prod still
  # uses Resend; see lib/email.ts transport selection.
  mailpit:
    image: axllent/mailpit:latest
    container_name: planora-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (app -> Mailpit)
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI + REST API
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planora_postgres_data:
