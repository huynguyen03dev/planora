name: CI

# Quality gate for the dev integration line and main release line.
# Runs on every PR into dev/main and on pushes that land there, so a PR that
# breaks lint, types, or tests cannot stay green. Pairs with the US-006/US-007
# security + RBAC suites — this is what gives them teeth on every change.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # PostgreSQL service provides an isolated DB for fail-closed integration proofs
      # (e.g. tests/db-index-proof.test.ts, which creates and cleans up ephemeral
      # sandbox schemas). lib/prisma builds its adapter lazily for unit tests.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planora?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated to app/generated/prisma/ (gitignored), so
      # typecheck and tests need it present before they run.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
