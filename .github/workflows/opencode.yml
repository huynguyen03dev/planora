name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".github/workflows/opencode.yml"
      - ".github/workflows/opencode-agent.yml"
      - ".vscode/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  opencode_review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run OpenCode Review
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai/zaio/glm-5.2
          use_github_token: true
          share: false
          prompt: |
            Review this pull request as a senior engineer reviewing a teammate's code.

            Flag only issues genuinely worth fixing before merge. Look for:
            - Security: XSS, injection, auth/authorization gaps, secret exposure.
            - Workspace isolation (high priority in this codebase): any Prisma query missing a workspaceId scope is a data leak. Also flag mutations that skip the Server Action contract — session check, then permission check, then workspace scoping, then Zod validation, then Prisma.
            - Next.js/React correctness: rules of hooks, server/client component boundaries, "use client" misuse.
            - Prisma: N+1 queries, missing indexes on filtered foreign keys, data integrity, server-action correctness.
            - TypeScript: type-safety holes and runtime edge cases.
            - Tests: risky logic (auth, ordering/position math, data writes) shipping with no test — this repo has no CI test gate, so call it out.

            Format the review to be scannable:
            - Open with a one-line summary: total findings and a severity tally, e.g. "3 findings — 1 critical, 2 medium". If nothing material, reply exactly "No material issues found." and stop.
            - Emit one block per finding, ordered most to least severe, using this exact shape:

              **<emoji> <Severity> — <short title>**
              - What: one sentence on the problem.
              - Why it matters: one sentence on the concrete impact in this diff.
              - Fix: the smallest reasonable fix.

            - Severity and emoji: 🔴 Critical, 🟠 High, 🟡 Medium, 🔵 Low/Nit. Mark optional polish as 🔵 Low.
            - Anchor findings as inline comments where possible; GitHub shows the location, so don't restate file or line in the text unless it adds clarity.

            Rules:
            - Be specific to this diff — no generic advice, filler, or canned praise.
            - Keep each field to one tight sentence; don't paste large code snippets.
            - If you are not confident something is a real bug, leave it out rather than guess.
            - Prefer a few high-signal findings over many shallow ones.
